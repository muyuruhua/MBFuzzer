# ═══════════════════════════════════════════════════════════════════════════
# mosquitto-v168.conf
#
# mosquitto v1.6.8 configuration for MBFuzzer gcov coverage collection.
# Aligned with ChatAFL's mosquitto.conf where possible, plus bridge config
# required by MBFuzzer's architecture.
#
# ChatAFL baseline (standalone, no bridge):
#   listener 1883 127.0.0.1
#   allow_anonymous true
#   max_connections -1
#   log_type none
#   persistence false
#   user root
#
# MBFuzzer addition: bridge connection back to host server_module.
# v1.6.8 only supports mqttv31 / mqttv311 for bridge (no mqttv50).
# ═══════════════════════════════════════════════════════════════════════════

# ─── Listener (matching ChatAFL) ─────────────────────────────────────────
listener 1883
allow_anonymous true
max_connections -1
log_type none
persistence false
user root

# ─── Bridge to MBFuzzer server_module on host ────────────────────────────
# The address is patched at runtime by run_mosquitto_parallel_docker.sh
# to point to each worker's unique server_module port.
connection bridge1
address 10.244.68.122:1884
restart_timeout 1
topic topic both 1 local/ remote/
topic topic both 1

keepalive_interval 600
remote_clientid mosquitto

# v1.6.8 only supports mqttv31 and mqttv311 (NOT mqttv50)
bridge_protocol_version mqttv311

notifications false
cleansession true
